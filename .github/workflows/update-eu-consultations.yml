name: Update EU consultations data

on:
  schedule:
    # 매일 05:00 UTC (한국시간 14:00)
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Have Your Say data
        run: node scripts/fetch_initiatives.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hi-eco/data/initiatives.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update EU consultation data ($(date -u +%Y-%m-%d))"
            git push
          fi
